services:
  - type: web
    name: museo-sang-bata-sa-negros-app
    runtime: docker
    rootDir: museum-system
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USER
        value: admin
      - key: SEED_ADMIN_PASS
        sync: false
      - key: SITE_NAME
        value: Museo Sang Bata sa Negros
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
